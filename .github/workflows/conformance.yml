name: MCP Conformance (reusable)

# REUSABLE protocol-conformance gate (on: workflow_call) — invoked by the thin caller
# workflow conformance-2025.2.yml (parameterized by EDT version so it stays ready for a
# future matrix), which gives the gate its OWN status badge. Runs the official
# modelcontextprotocol/conformance suite against a LIVE MCP server and compares against
# the committed baseline of intentional gaps, so the gate catches protocol REGRESSIONS
# — not the known, deliberate gaps.
#
# Runs entirely on STOCK GitHub-hosted runners (ubuntu-latest): no docker image, no
# self-hosted runner. The `build` job builds the MCP plugin; the `conformance` job then
# uses the `setup-edt` composite to materialize Eclipse + 1C:EDT of inputs.edt (from the
# public p2) + the built plugin, boots EDT headless under Xvfb, and the conformance
# client hits the local :8765. Conformance is protocol-only — no EDT project and no 1C
# platform license needed.
#
# Note: the plugin is compiled against the 2025.2 target (mcp/targets). This gate
# runs the same artifact on EDT 2025.2 (Eclipse 4.30 / Java 17).

on:
  workflow_call:
    inputs:
      edt:
        description: "EDT version (public p2 ruby/<version>/)"
        required: true
        type: string
      spec_version:
        description: "MCP spec version to test against"
        required: false
        default: "2025-11-25"
        type: string
      java:
        description: "JDK the EDT under test requires at RUNTIME (EDT 2025.2 ⇒ 17)"
        required: false
        default: "17"
        type: string
      eclipse-archive:
        description: "Eclipse Platform archive the EDT under test is built on"
        required: false
        default: "https://archive.eclipse.org/eclipse/downloads/drops4/R-4.30-202312010400/eclipse-platform-4.30-linux-gtk-x86_64.tar.gz"
        type: string
      eclipse-p2:
        description: "Eclipse release p2 (for the platform closure) matching that base"
        required: false
        default: "https://download.eclipse.org/releases/2023-12/"
        type: string
      orbit-simrel-p2:
        description: "Eclipse Orbit aggregation p2 (Batik / SVG) matching that base"
        required: false
        default: "https://download.eclipse.org/tools/orbit/simrel/orbit-aggregation/release/4.37.0/"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Cache Tycho P2 repositories
        uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository/.cache/tycho
            ~/.m2/repository/p2
          key: ${{ runner.os }}-tycho-p2-${{ hashFiles('**/*.target') }}
          restore-keys: |
            ${{ runner.os }}-tycho-p2-

      - name: Build the MCP plugin (p2 repository)
        working-directory: mcp
        env:
          MAVEN_OPTS: -Xmx2g -XX:+UseParallelGC
        run: bash "$GITHUB_WORKSPACE/.github/scripts/mvn-retry.sh" clean verify --batch-mode --no-transfer-progress -T 1C -DskipTests

      - name: Build the MCP proxy
        run: bash "$GITHUB_WORKSPACE/.github/scripts/mvn-retry.sh" -f proxy/pom.xml clean package --batch-mode --no-transfer-progress -DskipTests

      - name: Upload plugin p2 repository
        uses: actions/upload-artifact@v7
        with:
          name: mcp-plugin-p2
          path: mcp/repositories/fm.giper.edt.mcp.server.repository/target/repository
          if-no-files-found: error

      - name: Upload proxy jar
        uses: actions/upload-artifact@v7
        with:
          name: mcp-proxy-jar
          path: proxy/target/edt-mcp-proxy-*.jar
          if-no-files-found: error

  conformance:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up the JDK EDT ${{ inputs.edt }} runs on
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java }}

      - name: Download plugin p2 repository
        uses: actions/download-artifact@v8
        with:
          name: mcp-plugin-p2
          path: plugin-p2

      - name: Download proxy jar
        uses: actions/download-artifact@v8
        with:
          name: mcp-proxy-jar
          path: proxy-jar

      - name: Set up headless EDT ${{ inputs.edt }} + MCP server
        uses: ./.github/actions/setup-edt
        with:
          plugin-repo: plugin-p2
          edt-p2: "https://edt.1c.ru/downloads/releases/ruby/${{ inputs.edt }}/"
          java-runtime: ${{ inputs.java }}
          eclipse-archive: ${{ inputs.eclipse-archive }}
          eclipse-p2: ${{ inputs.eclipse-p2 }}
          orbit-simrel-p2: ${{ inputs.orbit-simrel-p2 }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # @modelcontextprotocol/conformance@latest uses fs.globSync, which is Node 22+
          # only (Node 20 errors: "module 'fs' does not provide an export named 'globSync'").
          node-version: "22"

      - name: Run MCP conformance suite
        env:
          SPEC_VERSION: ${{ inputs.spec_version }}
        run: |
          set -euo pipefail
          PROXY_JAR="$(ls proxy-jar/edt-mcp-proxy-*.jar | head -n 1)"
          java -jar "$PROXY_JAR" serve --port 8764 --scan 8765-8765 >/tmp/edt-mcp-proxy.log 2>&1 &
          echo "proxy_pid=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:8764/health" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          urls=(
            "http://127.0.0.1:8765/mcp"
            "http://127.0.0.1:8765/mcp/profiles/default"
            "http://127.0.0.1:8765/mcp/profiles/e2e-review"
            "http://127.0.0.1:8764/mcp"
            "http://127.0.0.1:8764/mcp/profiles/default"
          )
          for url in "${urls[@]}"; do
            echo "[conformance] $url"
            npx --yes @modelcontextprotocol/conformance@latest server \
              --url "$url" \
              --spec-version "$SPEC_VERSION" \
              --expected-failures tests/conformance/baseline.yml
          done

      - name: Upload EDT log
        if: ${{ always() && env.edt_log != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: conformance-edt-log-${{ inputs.edt }}
          path: ${{ env.edt_log }}
          if-no-files-found: ignore

      - name: Stop EDT
        if: always()
        run: |
          kill "${proxy_pid:-0}" 2>/dev/null || true
          kill "${edt_pid:-0}" 2>/dev/null || true
