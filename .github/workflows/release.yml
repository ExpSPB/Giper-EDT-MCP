name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The MCP plugin is BUILT on 25: Tycho 5 needs Maven on JDK 21+, and tycho-surefire runs
      # the EDT 2026.2 platform bundles, which are Java 25. The bundle itself still compiles to
      # release 17 (mcp/bom/pom.xml), so one artifact keeps loading on EDT 2026.1.
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      # Maven is pinned, not the runner image's: see the action for why 3.10 breaks Tycho.
      - name: Set up Maven
        uses: ./.github/actions/setup-maven

      # Before Maven: an inconsistent or drifted EDT channel must fail with its real reason, not
      # with Tycho's opaque "bundleLocation can't be null". The served build also keys the cache,
      # so a new EDT build saves a fresh cache instead of re-downloading its jars on every run.
      - name: EDT channel guard
        id: edt-channel
        uses: ./.github/actions/edt-channel-guard

      - name: Cache Tycho P2 repositories
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository/.cache/tycho
            ~/.m2/repository/p2
          key: ${{ runner.os }}-tycho-p2-${{ hashFiles('**/*.target') }}-${{ steps.edt-channel.outputs.edt-build }}
          restore-keys: |
            ${{ runner.os }}-tycho-p2-${{ hashFiles('**/*.target') }}-
            ${{ runner.os }}-tycho-p2-

      - name: Extract version from tag
        id: version
        run: |
          # tag: v1.26.0 → 1.26.0
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set version from tag
        working-directory: mcp
        run: |
          set -euo pipefail
          # From the pom, not pinned here: a hardcoded 4.0.5 stopped loading on the move to Tycho 5.
          TYCHO=$(sed -n 's|.*<tycho\.version>\(.*\)</tycho\.version>.*|\1|p' bom/pom.xml)
          test -n "$TYCHO"
          echo "tycho-versions-plugin: $TYCHO"
          mvn "org.eclipse.tycho:tycho-versions-plugin:$TYCHO:set-version" \
            -DnewVersion=${{ steps.version.outputs.version }} \
            --batch-mode --no-transfer-progress

      - name: Maven build
        working-directory: mcp
        env:
          MAVEN_OPTS: -Xmx2g -XX:+UseParallelGC
        run: bash "$GITHUB_WORKSPACE/.github/scripts/mvn-retry.sh" clean verify --batch-mode --no-transfer-progress -T 1C -Dgiper.releaseBuild=true

      - name: Build proxy
        env:
          MAVEN_OPTS: -Xmx2g
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          mvn -f proxy/pom.xml clean verify --batch-mode --no-transfer-progress
          shopt -s nullglob
          jars=()
          # Maven Shade replaces the main artifact and can leave an intermediate JAR.
          for jar in proxy/target/edt-mcp-proxy-*.jar; do
            if [[ "$jar" != *-shaded.jar ]]; then
              jars+=("$jar")
            fi
          done
          if (( ${#jars[@]} != 1 )); then
            echo "::error::Expected exactly one packaged proxy JAR, found ${#jars[@]}"
            exit 1
          fi
          cp -- "${jars[0]}" "edt-mcp-proxy-v${RELEASE_VERSION}.jar"

      - name: Package archive
        run: |
          cd mcp/repositories/fm.giper.edt.mcp.server.repository/target/repository
          zip -r "$GITHUB_WORKSPACE/MCP-EDT.v${{ steps.version.outputs.version }}.zip" .

      - name: Prepare approved v1.0.15 release notes
        id: release_notes
        if: github.ref_name == 'v1.0.15'
        run: |
          body_path="$RUNNER_TEMP/giper-release-notes.md"
          cat > "$body_path" <<'RELEASE_NOTES'
          Giper-EDT-MCP 1.0.15 переносит профили инструментов на актуальную базу EDT-MCP для 1С:EDT 2026.2. Релиз проверен на 1С:EDT 2026.2.2.21.

          ### Что изменилось

          - В настройках **Сервер MCP → Инструменты** можно создавать и дублировать профили, настраивать доступные инструменты, копировать адрес подключения и импортировать или экспортировать профиль в JSON. Изменения вступают в силу после «Применить» или «ОК».
          - Именованные профили доступны по `/mcp/profiles/<id>`. Для явного подключения к профилю `default` используйте `/mcp/profiles/default`. Прежний адрес `/mcp` сохраняет совместимость с существующими настройками подключения.
          - HTTP-сессия привязана к маршруту профиля. Изменения списка разрешённых инструментов действуют со следующего запроса. Клиенты с открытым SSE-потоком получают уведомление об изменении списка инструментов для своего маршрута.
          - `edt-mcp-proxy` поддерживает профильные маршруты и учитывает совместимость подключённых серверов EDT при выборе адресата вызова.
          - `get_server_status` показывает запрошенный и фактический профили. Параметр `includeProfiles` добавляет список доступных профилей, а `includeProfileTools` — их списки инструментов.
          - Проверка обновлений обращается к GitHub Releases форка и включена в релизной сборке.

          На стенде проверены импорт и экспорт через интерфейс EDT, сохранение профиля после перезапуска и разные права профилей при вызове через прокси.

          ### Файлы релиза

          - `MCP-EDT.v1.0.15.zip` — архив для установки плагина в EDT.
          - `edt-mcp-proxy-v1.0.15.jar` — отдельный прокси для работы с несколькими экземплярами EDT.

          Для установок на EDT 2025.2.5 сохранена ветка `giper-2025.2`.
          RELEASE_NOTES
          printf '%s\n' 'title=Giper-EDT-MCP 1.0.15 для 1С:EDT 2026.2' "body_path=$body_path" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release draft
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.release_notes.outputs.title || format('MCP-EDT v{0}', steps.version.outputs.version) }}
          body_path: ${{ steps.release_notes.outputs.body_path }}
          draft: true
          files: |
            MCP-EDT.v${{ steps.version.outputs.version }}.zip
            edt-mcp-proxy-v${{ steps.version.outputs.version }}.jar
          fail_on_unmatched_files: true
          generate_release_notes: false
