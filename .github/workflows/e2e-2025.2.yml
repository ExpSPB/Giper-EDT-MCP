name: E2E 2025.2

# Thin per-version caller of the reusable E2E gate (e2e-tests.yml) so EDT 2025.2
# (channel that currently serves 2025.2.5) gets its OWN status badge.

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: e2e-2025.2-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    uses: ./.github/workflows/e2e-tests.yml
    with:
      edt: "2025.2"
      java: "17"
      eclipse-archive: "https://archive.eclipse.org/eclipse/downloads/drops4/R-4.30-202312010400/eclipse-platform-4.30-linux-gtk-x86_64.tar.gz"
      eclipse-p2: "https://download.eclipse.org/releases/2023-12/"
      orbit-simrel-p2: "https://download.eclipse.org/tools/orbit/simrel/orbit-aggregation/release/4.37.0/"
